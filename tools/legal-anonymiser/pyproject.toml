[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-anonymiser"
version = "4.5.0"
description = "Pseudonymisation locale de contrats, sans reseau"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=6.0",
    "Pillow>=11.0",
    "spacy>=3.8",
]

[project.scripts]
legal-anonymiser = "legal_anonymiser.cli:main"

[tool.setuptools.packages.find]
include = ["legal_anonymiser*"]

[tool.setuptools.package-data]
legal_anonymiser = ["data/*.txt"]
